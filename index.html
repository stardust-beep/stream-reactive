<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    /* Custom Background Settings */
    background-image: url('background.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .avatar {
    max-width: 500px;
    max-height: 500px;
    transition: transform 0.08s ease, filter 0.08s ease;
    filter: brightness(0.65) drop-shadow(0 0 10px rgba(0,0,0,0.6));
  }

  .talking {
    filter: brightness(1.15) drop-shadow(0 0 25px #00f0ff);
    transform: scale(1.04);
  }
</style>
</head>
<body>

<img id="avatar" class="avatar" src="idle.png" alt="Avatar">

<script>
  const idleSrc = "idle.png";
  const talkSrc = "talk.png";
  const avatar = document.getElementById("avatar");

  const THRESHOLD = 0.035; 

  navigator.mediaDevices.getUserMedia({ audio: true, video: false })
    .then(stream => {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const analyser = audioContext.createAnalyser();
      const microphone = audioContext.createMediaStreamSource(stream);
      analyser.fftSize = 512;
      microphone.connect(analyser);

      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      function checkAudio() {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        let average = sum / dataArray.length / 255;

        if (average > THRESHOLD) {
          avatar.src = talkSrc;
          avatar.classList.add("talking");
        } else {
          avatar.src = idleSrc;
          avatar.classList.remove("talking");
        }
        requestAnimationFrame(checkAudio);
      }
      checkAudio();
    })
    .catch(err => console.error("Mic access error:", err));
</script>
</body>
</html>

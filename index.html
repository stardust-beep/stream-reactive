<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000;
  }
  video {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>

<video autoplay loop muted playsinline>
  <!-- Replace with your actual video filename -->
  <source src="talking-loop.mp4" type="video/mp4">
</video>

</body>
</html>
